basePath: /v1
definitions:
  domain.Config:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      provider:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  http.ErrEmailConflict:
    properties:
      error:
        example: email already registered
        type: string
    type: object
  http.ErrEmailConflictOAuth:
    properties:
      error:
        example: email already registered with password login
        type: string
    type: object
  http.ErrGitHubAuth:
    properties:
      error:
        example: failed to authenticate with GitHub
        type: string
    type: object
  http.ErrInternal:
    properties:
      error:
        example: internal server error
        type: string
    type: object
  http.ErrInvalidBody:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  http.ErrInvalidCredentials:
    properties:
      error:
        example: invalid email or password
        type: string
    type: object
  http.ErrInvalidState:
    properties:
      error:
        example: invalid or expired state parameter
        type: string
    type: object
  http.ErrValidation:
    properties:
      error:
        example: name, email and password are required
        type: string
    type: object
  http.loginRequest:
    properties:
      email:
        example: joao@empresa.com
        type: string
      password:
        example: s3nh4segura
        type: string
    type: object
  http.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  http.tokenResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  http.updateConfigRequest:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API interna para o time de desenvolvimento.
  title: API Pão de Queijo
  version: "1.0"
paths:
  /auth/github:
    get:
      description: Redireciona para o GitHub OAuth
      responses:
        "302":
          description: Redireciona para GitHub
      summary: Iniciar login com GitHub
      tags:
      - auth
  /auth/github/callback:
    get:
      description: GitHub chama este endpoint após autorização
      parameters:
      - description: Código do GitHub
        in: query
        name: code
        required: true
        type: string
      - description: State anti-CSRF
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: token JWT
          schema:
            $ref: '#/definitions/http.tokenResponse'
        "400":
          description: invalid or expired state parameter
          schema:
            $ref: '#/definitions/http.ErrInvalidState'
        "409":
          description: email already registered with password login
          schema:
            $ref: '#/definitions/http.ErrEmailConflictOAuth'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrInternal'
        "502":
          description: failed to authenticate with GitHub
          schema:
            $ref: '#/definitions/http.ErrGitHubAuth'
      summary: Callback do GitHub OAuth
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token JWT
          schema:
            $ref: '#/definitions/http.tokenResponse'
        "401":
          description: invalid email or password
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "422":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrInvalidBody'
      summary: Login com email e senha
      tags:
      - auth
  /config:
    get:
      description: Retorna todas as configurações globais do sistema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Config'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
      security:
      - BearerAuth: []
      summary: Listar configurações
      tags:
      - config
    put:
      consumes:
      - application/json
      description: Atualiza o valor de uma chave de configuração (somente admin)
      parameters:
      - description: Chave e valor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.updateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Config'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "403":
          description: admin role required
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrValidation'
      security:
      - BearerAuth: []
      summary: Atualizar configuração
      tags:
      - config
  /users:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário com email e senha
      parameters:
      - description: Dados do usuário
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.User'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/http.ErrEmailConflict'
        "422":
          description: name, email and password are required
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrInternal'
      summary: Cadastrar usuário
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
