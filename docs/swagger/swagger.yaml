basePath: /v1
definitions:
  domain.Config:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  domain.RotationMember:
    properties:
      position:
        type: integer
      user_id:
        type: string
    type: object
  domain.Round:
    properties:
      closes_at:
        type: string
      created_at:
        type: string
      date:
        description: '"YYYY-MM-DD"'
        type: string
      id:
        type: string
      notify_at:
        type: string
      payer_id:
        type: string
      status:
        $ref: '#/definitions/domain.RoundStatus'
    type: object
  domain.RoundStatus:
    enum:
    - pending
    - open
    - closed
    - cancelled
    type: string
    x-enum-varnames:
    - RoundStatusPending
    - RoundStatusOpen
    - RoundStatusClosed
    - RoundStatusCancelled
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      provider:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  http.ErrEmailConflict:
    properties:
      error:
        example: email already registered
        type: string
    type: object
  http.ErrEmailConflictOAuth:
    properties:
      error:
        example: email already registered with password login
        type: string
    type: object
  http.ErrGitHubAuth:
    properties:
      error:
        example: failed to authenticate with GitHub
        type: string
    type: object
  http.ErrInternal:
    properties:
      error:
        example: internal server error
        type: string
    type: object
  http.ErrInvalidBody:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  http.ErrInvalidCredentials:
    properties:
      error:
        example: invalid email or password
        type: string
    type: object
  http.ErrInvalidState:
    properties:
      error:
        example: invalid or expired state parameter
        type: string
    type: object
  http.ErrValidation:
    properties:
      error:
        example: name, email and password are required
        type: string
    type: object
  http.loginRequest:
    properties:
      email:
        example: joao@empresa.com
        type: string
      password:
        example: s3nh4segura
        type: string
    type: object
  http.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  http.tokenResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  http.updateConfigRequest:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  http.updateOrderRequest:
    properties:
      user_ids:
        items:
          type: string
        type: array
    type: object
  usecase.PaginatedRoundsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Round'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  usecase.RotationResponse:
    properties:
      current_payer_id:
        type: string
      current_pos:
        type: integer
      members:
        items:
          $ref: '#/definitions/domain.RotationMember'
        type: array
    type: object
  usecase.TodayRoundResponse:
    properties:
      closes_at:
        type: string
      created_at:
        type: string
      date:
        description: '"YYYY-MM-DD"'
        type: string
      id:
        type: string
      is_payer:
        type: boolean
      notify_at:
        type: string
      payer_id:
        type: string
      status:
        $ref: '#/definitions/domain.RoundStatus'
    type: object
host: localhost:8080
info:
  contact: {}
  description: API interna para o time de desenvolvimento.
  title: API Pão de Queijo
  version: "1.0"
paths:
  /auth/github:
    get:
      description: Redireciona para o GitHub OAuth
      responses:
        "302":
          description: Redireciona para GitHub
      summary: Iniciar login com GitHub
      tags:
      - auth
  /auth/github/callback:
    get:
      description: GitHub chama este endpoint após autorização
      parameters:
      - description: Código do GitHub
        in: query
        name: code
        required: true
        type: string
      - description: State anti-CSRF
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: token JWT
          schema:
            $ref: '#/definitions/http.tokenResponse'
        "400":
          description: invalid or expired state parameter
          schema:
            $ref: '#/definitions/http.ErrInvalidState'
        "409":
          description: email already registered with password login
          schema:
            $ref: '#/definitions/http.ErrEmailConflictOAuth'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrInternal'
        "502":
          description: failed to authenticate with GitHub
          schema:
            $ref: '#/definitions/http.ErrGitHubAuth'
      summary: Callback do GitHub OAuth
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token JWT
          schema:
            $ref: '#/definitions/http.tokenResponse'
        "401":
          description: invalid email or password
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "422":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrInvalidBody'
      summary: Login com email e senha
      tags:
      - auth
  /config:
    get:
      description: Retorna todas as configurações globais do sistema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Config'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
      security:
      - BearerAuth: []
      summary: Listar configurações
      tags:
      - config
    put:
      consumes:
      - application/json
      description: Atualiza o valor de uma chave de configuração (somente admin)
      parameters:
      - description: Chave e valor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.updateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Config'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "403":
          description: admin role required
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrValidation'
      security:
      - BearerAuth: []
      summary: Atualizar configuração
      tags:
      - config
  /rotation:
    get:
      description: Retorna a fila circular de pagadores com a posição atual
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.RotationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
      security:
      - BearerAuth: []
      summary: Listar rodízio atual
      tags:
      - rotation
  /rotation/order:
    put:
      consumes:
      - application/json
      description: Substitui a fila de pagadores (somente admin)
      parameters:
      - description: Array completo de user_ids na nova ordem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.updateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "403":
          description: admin role required
          schema:
            $ref: '#/definitions/http.ErrValidation'
      security:
      - BearerAuth: []
      summary: Atualizar ordem do rodízio
      tags:
      - rotation
  /rotation/skip:
    post:
      description: Avança a posição atual da fila para o próximo usuário (somente
        admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "403":
          description: admin role required
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "409":
          description: rotation not initialized
          schema:
            $ref: '#/definitions/http.ErrValidation'
      security:
      - BearerAuth: []
      summary: Pular vez no rodízio
      tags:
      - rotation
  /rounds:
    get:
      description: Retorna histórico paginado de rodadas
      parameters:
      - description: Página (default 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.PaginatedRoundsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
      security:
      - BearerAuth: []
      summary: Listar rodadas
      tags:
      - rounds
  /rounds/{id}/cancel:
    post:
      description: Pagador cancela a rodada; próximo da fila é notificado
      parameters:
      - description: Round ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "403":
          description: payer only
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "409":
          description: round not in pending status
          schema:
            $ref: '#/definitions/http.ErrValidation'
      security:
      - BearerAuth: []
      summary: Cancelar pagamento
      tags:
      - rounds
  /rounds/{id}/confirm:
    post:
      description: Pagador confirma a rodada, abrindo para participações
      parameters:
      - description: Round ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
        "403":
          description: payer only
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "409":
          description: round not in pending status
          schema:
            $ref: '#/definitions/http.ErrValidation'
      security:
      - BearerAuth: []
      summary: Confirmar pagamento
      tags:
      - rounds
  /rounds/today:
    get:
      description: Retorna a rodada do dia atual com campo is_payer para o usuário
        autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.TodayRoundResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrInvalidCredentials'
      security:
      - BearerAuth: []
      summary: Rodada de hoje
      tags:
      - rounds
  /users:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário com email e senha
      parameters:
      - description: Dados do usuário
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.User'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/http.ErrEmailConflict'
        "422":
          description: name, email and password are required
          schema:
            $ref: '#/definitions/http.ErrValidation'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/http.ErrInternal'
      summary: Cadastrar usuário
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
